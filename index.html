<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Screen</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: 6vh;
      }

      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
      }

      button {
        min-width: 25vw;
        min-height: 8vh;
        font-size: 3vh;
      }

      .profile-panel {
        position: fixed;
        right: 2%;
        bottom: 2%;
        display: flex;
        align-items: center;
        gap: 1.5vw;
        z-index: 999;
      }

      .profile-panel button {
        width: 6vh;
        height: 6vh;
        min-width: 0;
        min-height: 0;
        max-width: 6vh;
        max-height: 6vh;
        border-radius: 50%;
        border: 0.1vh solid #000;
        padding: 0;
      }

      .profile-panel .profile-name {
        font-size: 2vh;
      }

      .profile-panel .profile-name span {
        font-weight: 700;
      }

      #game-container {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #808080;
      }

      /* Mobile landscape - shrink height and move away from bottom to avoid swipe gestures */
      @media (max-height: 500px) {
        #game-container {
          height: 85vh;
          bottom: auto;
          top: 0;
        }
      }

      #game-container canvas {
        display: block;
        background: #808080;
      }

      #fullscreen-btn {
        position: fixed;
        bottom: 2vh;
        left: 2vw;
        z-index: 999;
        padding: 1vh 2vw;
        font-size: 2vh;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 0.2vh solid white;
        border-radius: 0.5vh;
        cursor: pointer;
        display: none;
      }

      #fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      #loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: #808080;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <main id="home-screen">
      <h1 class="title">Title</h1>
      <div class="button-container">
        <button id="play-btn">play</button>
        <button id="saves-btn">saves</button>
        <button id="settings-btn">settings</button>
      </div>
    </main>

    <div class="profile-panel" id="profile-panel">
      <button id="profile-btn" aria-label="Profile"></button>
      <div class="profile-name">Logged in as <span>Name</span></div>
    </div>

    <div id="game-container">
      <button id="fullscreen-btn">Fullscreen</button>
      <div id="loading-overlay"></div>
    </div>

    <script src="phaser.js"></script>
    <script src="Scenes/bootScene.js"></script>
    <script src="Scenes/gameScene/objectFactory.js"></script>
    <script src="Scenes/gameScene/player.js"></script>
    <script src="Scenes/gameScene/gameLogic.js"></script>
    <script src="Scenes/gameScene/buildingManager.js"></script>
    <script src="Scenes/gameScene.js"></script>
    <script src="Scenes/levelSelectScene.js"></script>
    <script src="Scenes/settingsScene.js"></script>
    <script src="Scenes/savesScene.js"></script>
    <script src="Scenes/profileScene.js"></script>
    <script src="Game.js"></script>
    <script>
      let game = null;

      const homeScreen = document.getElementById("home-screen");
      const gameContainer = document.getElementById("game-container");
      const loadingOverlay = document.getElementById("loading-overlay");
      const profilePanel = document.getElementById("profile-panel");
      const profileBtn = document.getElementById("profile-btn");
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const PROFILE_PANEL_HIDDEN_SCENES = new Set(["GameScene"]);

      function addBackButton(scene, onClick) {
        const fontSize = Math.round(scene.scale.height * 0.04);
        const x = Math.round(scene.scale.width * 0.02);
        const y = Math.round(scene.scale.height * 0.02);

        return scene.add
          .text(x, y, "Back", {
            fontFamily: "Arial, sans-serif",
            fontSize: `${fontSize}px`,
            color: "#000000",
          })
          .setInteractive()
          .setOrigin(0, 0)
          .setDepth(1000)
          .on("pointerdown", () => {
            onClick();
          });
      }

      function destroyGame() {
        if (game) {
          game.destroy(true);
          game = null;
        }
      }

      window.showHomeScreen = function () {
        destroyGame();
        gameContainer.style.display = "none";
        homeScreen.style.display = "flex";
        profilePanel.style.display = "flex";
      };

      window.startScene = function (sceneKey) {
        destroyGame();

        homeScreen.style.display = "none";
        gameContainer.style.display = "block";
        loadingOverlay.style.display = "block";
        profilePanel.style.display = PROFILE_PANEL_HIDDEN_SCENES.has(sceneKey)
          ? "none"
          : "flex";

        game = new Phaser.Game(config);
        game.events.once("ready", () => {
          game.scene.start(sceneKey);
          loadingOverlay.style.display = "none";
        });
      };

      document
        .getElementById("play-btn")
        .addEventListener("click", () => window.startScene("LevelSelectScene"));
      document
        .getElementById("saves-btn")
        .addEventListener("click", () => window.startScene("SavesScene"));
      document
        .getElementById("settings-btn")
        .addEventListener("click", () => window.startScene("SettingsScene"));

      if (profileBtn) {
        profileBtn.addEventListener("click", () =>
          window.startScene("ProfileScene"),
        );
      }

      // Fullscreen and landscape functionality
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      function requestFullscreenAndLandscape() {
        const elem = document.documentElement;
        
        // Request fullscreen
        const fullscreenPromise = elem.requestFullscreen
          ? elem.requestFullscreen()
          : elem.mozRequestFullScreen
          ? elem.mozRequestFullScreen()
          : elem.webkitRequestFullscreen
          ? elem.webkitRequestFullscreen()
          : elem.msRequestFullscreen
          ? elem.msRequestFullscreen()
          : Promise.reject('Fullscreen not supported');

        fullscreenPromise.catch(err => console.log('Fullscreen error:', err));

        // Request landscape orientation if API available
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(err => console.log('Orientation lock error:', err));
        }
      }

      function exitFullscreen() {
        if (document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      }

      fullscreenBtn.addEventListener("click", () => {
        if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
          requestFullscreenAndLandscape();
        } else {
          exitFullscreen();
        }
      });

      // Listen for fullscreen change events
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && isMobile && gameContainer.style.display === 'block') {
          localStorage.setItem('mobileFullscreenPrompted', 'false');
        }
      });
      document.addEventListener('mozfullscreenchange', () => {
        if (!document.mozFullScreenElement && isMobile && gameContainer.style.display === 'block') {
          localStorage.setItem('mobileFullscreenPrompted', 'false');
        }
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (!document.webkitFullscreenElement && isMobile && gameContainer.style.display === 'block') {
          localStorage.setItem('mobileFullscreenPrompted', 'false');
        }
      });
      document.addEventListener('msfullscreenchange', () => {
        if (!document.msFullscreenElement && isMobile && gameContainer.style.display === 'block') {
          localStorage.setItem('mobileFullscreenPrompted', 'false');
        }
      });

      // Show fullscreen button on mobile when in game
      const originalStartScene = window.startScene;
      window.startScene = function(sceneKey) {
        originalStartScene.call(this, sceneKey);
        if (isMobile) {
          fullscreenBtn.style.display = "block";
          // Auto-request fullscreen on game start if not already prompted
          const hasBeenPrompted = localStorage.getItem('mobileFullscreenPrompted');
          if (!hasBeenPrompted) {
            requestFullscreenAndLandscape();
            localStorage.setItem('mobileFullscreenPrompted', 'true');
          }
        }
      };

      // Hide fullscreen button when returning to home
      const originalShowHomeScreen = window.showHomeScreen;
      window.showHomeScreen = function() {
        originalShowHomeScreen.call(this);
        fullscreenBtn.style.display = "none";
      };

      // Request fullscreen on initial page load for mobile
      if (isMobile) {
        document.addEventListener('DOMContentLoaded', () => {
          const hasBeenPrompted = localStorage.getItem('mobileFullscreenPrompted');
          if (!hasBeenPrompted) {
            // Auto-request fullscreen on first load
            requestFullscreenAndLandscape();
            localStorage.setItem('mobileFullscreenPrompted', 'true');
          }
        });
      }
    </script>
  </body>
</html>

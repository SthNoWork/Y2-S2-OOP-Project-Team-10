<!doctype html>
<!-- index.html
     Application shell and entry point.
     Owns: the home screen, startup loading bar, MusicManager, scene routing,
     fullscreen/orientation handling, and all DOM-to-script wiring.
     The Phaser canvas lives inside #game-container and is toggled visible/hidden
     as the player moves between the HTML home screen and Phaser scenes.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Screen</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
      }

      #home-screen {
        width: 100vw;
        height: 100vh;
        background: url('asset/background/menu-theme.png') center / cover no-repeat;
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: 6vh;
        color: gray;
      }

      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2vh;
      }

      button {
        min-width: 25vw;
        min-height: 8vh;
        font-size: 3vh;
      }

      /* Profile pill fixed to the bottom-right, hidden while in-game. */
      .profile-panel {
        position: fixed;
        right: 2%;
        bottom: 2%;
        display: flex;
        align-items: center;
        gap: 1.5vw;
        z-index: 2500;
      }

      .profile-panel button {
        width: 6vh;
        height: 6vh;
        min-width: 0;
        min-height: 0;
        max-width: 6vh;
        max-height: 6vh;
        border-radius: 50%;
        border: 0.1vh solid #000;
        padding: 0;
      }

      .profile-panel .profile-name       { font-size: 2vh; }
      .profile-panel .profile-name span  { font-weight: 700; }

      /* Hidden by default; shown when a Phaser scene is running. */
      #game-container {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #808080;
      }

      /* On short mobile viewports shrink the canvas to avoid the swipe gesture zone. */
      @media (max-height: 500px) {
        #game-container {
          height: 85vh;
          bottom: auto;
          top: 0;
        }
      }

      #game-container canvas {
        display: block;
        background: #808080;
      }

      /* Fixed fullscreen toggle, shown only while a scene is active. */
      #fullscreen-btn {
        position: fixed;
        bottom: 2vh;
        left: 2vw;
        z-index: 999;
        padding: 1vh 2vw;
        font-size: 2vh;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 0.2vh solid white;
        border-radius: 0.5vh;
        cursor: pointer;
        display: none;
      }

      #fullscreen-btn:hover { background: rgba(0, 0, 0, 0.8); }

      /* Gray overlay shown while Phaser is initialising. */
      #loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: #808080;
        z-index: 10;
      }

      /* Full-screen splash shown on first page load while assets are downloaded. */
      #startup-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: url('asset/background/theme.png') center / cover no-repeat;
        z-index: 2000;
      }

      #startup-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3vh;
        transform: translateY(42vh);
        border-radius: 10px;
      }

      #startup-overlay .loading-text {
        font-size: 3vh;
        padding: 0;
        border: 0;
        background: transparent;
        color: white;
      }

      #startup-progress {
        width: 40vw;
        max-width: 700px;
        height: 2.5vh;
        border: 0.4vh solid #000;
        background: #ffffff;
        overflow: hidden;
        border-radius: 10px;
      }

      #startup-progress-bar {
        width: 0%;
        height: 100%;
        background: #2ecc71;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>

    <!-- Full-screen splash shown while the page first loads. -->
    <div id="startup-overlay">
      <div id="startup-loading">
        <div id="startup-progress">
          <div id="startup-progress-bar"></div>
        </div>
        <div class="loading-text">Loading...</div>
      </div>
    </div>

    <!-- HTML home screen — visible before any Phaser scene is started. -->
    <main id="home-screen">
      <h1 class="title">Build To Survive</h1>
      <div class="button-container">
        <button id="play-btn">play</button>
        <button id="saves-btn">saves</button>
        <button id="settings-btn">settings</button>
      </div>
    </main>

    <!-- Profile pill shown on the home screen. -->
    <div class="profile-panel" id="profile-panel">
      <button id="profile-btn" aria-label="Profile"></button>
      <div class="profile-name">Logged in as <span>Name</span></div>
    </div>

    <!-- Phaser canvas is injected here by Phaser.Game. -->
    <div id="game-container">
      <button id="fullscreen-btn">Fullscreen</button>
      <div id="loading-overlay"></div>
    </div>

    <!-- Load order matters: Phaser → data → factories → scenes → game config. -->
    <script src="phaser.js"></script>
    <script src="assets.js"></script>
    <script src="spriteFactory.js"></script>
    <script src="Scenes/bootScene.js"></script>
    <script src="Scenes/gameScene/objectConfig.js"></script>
    <script src="Scenes/gameScene/objectFactory.js"></script>
    <script src="uiFactory.js"></script>
    <script src="Scenes/gameScene/gameLogic.js"></script>
    <script src="Scenes/gameScene/buildingManager.js"></script>
    <script src="levels.js"></script>
    <script src="Scenes/gameScene/levelManager.js"></script>
    <script src="Scenes/gameScene.js"></script>
    <script src="Scenes/levelSelectScene.js"></script>
    <script src="Scenes/settingsScene.js"></script>
    <script src="Scenes/savesScene.js"></script>
    <script src="Scenes/profileScene.js"></script>
    <script src="Game.js"></script>

    <script>
      // DOM references used by the routing and fullscreen helpers below.
      const homeScreen     = document.getElementById('home-screen');
      const gameContainer  = document.getElementById('game-container');
      const loadingOverlay = document.getElementById('loading-overlay');
      const profilePanel   = document.getElementById('profile-panel');
      const profileBtn     = document.getElementById('profile-btn');
      const fullscreenBtn  = document.getElementById('fullscreen-btn');
      const startupOverlay = document.getElementById('startup-overlay');
      const startupBar     = document.getElementById('startup-progress-bar');

      // MusicManager — singleton created on first access.
      // Plays a shared menu track by default and switches to per-level audio
      // when a GameScene starts. Browser autoplay policy means audio cannot
      // start until the first user gesture, hence the once-listener below.
      window.MusicManager = window.MusicManager || (() => {
        const sharedPath  = 'asset/music/Forest Drift.mp3';
        const volume      = 0.5;
        const sharedAudio = new Audio(sharedPath);
        sharedAudio.loop   = true;
        sharedAudio.volume = volume;

        return {
          mode:             'shared',
          sharedAudio,
          levelAudio:       null,
          currentLevelPath: null,

          // Starts or resumes the shared menu track.
          // Pass { restart: true } to rewind before playing.
          playShared(opts = {}) {
            const restart = !!opts.restart;
            if (this.mode === 'shared' && !restart && !this.sharedAudio.paused) return;
            if (this.levelAudio) {
              this.levelAudio.pause();
              this.levelAudio.currentTime = 0;
            }
            if (restart) this.sharedAudio.currentTime = 0;
            this.sharedAudio.play().catch(() => {});
            this.mode = 'shared';
          },

          // Switches to the music track defined for the given level number.
          // Falls back to the shared track if the level has no music path.
          playLevel(levelNum) {
            const path = window.Levels?.[levelNum]?.music;
            if (!path) {
              this.playShared({ restart: this.mode === 'level' });
              return;
            }
            this.sharedAudio.pause();
            this.sharedAudio.currentTime = 0;

            if (!this.levelAudio || this.currentLevelPath !== path) {
              if (this.levelAudio) {
                this.levelAudio.pause();
                this.levelAudio.currentTime = 0;
              }
              this.levelAudio            = new Audio(path);
              this.levelAudio.loop       = true;
              this.levelAudio.volume     = volume;
              this.currentLevelPath      = path;
            } else {
              this.levelAudio.currentTime = 0;
            }

            this.levelAudio.play().catch(() => {});
            this.mode = 'level';
          },
        };
      })();

      // Start audio on the very first pointer or key event (satisfies autoplay policy).
      const startSharedOnFirstGesture = () => {
        window.MusicManager.playShared({ restart: false });
      };
      document.addEventListener('pointerdown', startSharedOnFirstGesture, { once: true });
      document.addEventListener('keydown',     startSharedOnFirstGesture, { once: true });

      // Scenes listed here hide the profile panel while active.
      const HIDE_PROFILE_IN = new Set(['GameScene']);

      let game = null;

      // Tears down the current Phaser instance so a fresh one can be created.
      function destroyGame() {
        if (game) { game.destroy(true); game = null; }
      }

      // Returns to the HTML home screen and resumes menu music.
      // Called from every scene's Back button via window.showHomeScreen().
      window.showHomeScreen = function () {
        destroyGame();
        gameContainer.style.display = 'none';
        homeScreen.style.display    = 'flex';
        profilePanel.style.display  = 'flex';
        fullscreenBtn.style.display = 'none';
        window.MusicManager.playShared({ restart: window.MusicManager.mode === 'level' });
      };

      // Hides the startup splash once the progress bar animation completes.
      function finishStartup() {
        if (startupOverlay) startupOverlay.style.display = 'none';
        window.showHomeScreen();
      }

      // Animates the startup progress bar over STARTUP_DURATION_MS, then calls finishStartup.
      function runStartupProgress() {
        if (!startupBar) { finishStartup(); return; }

        const STARTUP_DURATION_MS = 2500;
        const startTime = performance.now();

        const tick = (now) => {
          const elapsed = now - startTime;
          const pct     = Math.min(elapsed / STARTUP_DURATION_MS, 1);
          startupBar.style.width = `${Math.round(pct * 100)}%`;
          if (pct < 1) {
            requestAnimationFrame(tick);
          } else {
            finishStartup();
          }
        };

        requestAnimationFrame(tick);
      }

      // Run the progress animation as soon as the page is fully loaded.
      if (document.readyState === 'complete') {
        runStartupProgress();
      } else {
        window.addEventListener('load', runStartupProgress, { once: true });
      }

      // Hides the home screen, shows the game container, and creates a new Phaser instance.
      // Passes the target scene key to BootScene via window._bootTarget.
      // On mobile, shows the fullscreen button and auto-requests fullscreen on first visit.
      window.startScene = function (sceneKey) {
        destroyGame();

        homeScreen.style.display     = 'none';
        gameContainer.style.display  = 'block';
        loadingOverlay.style.display = 'block';
        profilePanel.style.display   = HIDE_PROFILE_IN.has(sceneKey) ? 'none' : 'flex';

        window._bootTarget = sceneKey;

        if (sceneKey === 'GameScene') {
          window.MusicManager.playLevel(window._currentLevel ?? 1);
        } else {
          window.MusicManager.playShared({ restart: window.MusicManager.mode === 'level' });
        }

        game = new Phaser.Game(config);
        game.events.once('ready', () => {
          loadingOverlay.style.display = 'none';
        });

        if (isMobile) {
          fullscreenBtn.style.display = 'block';
          if (!localStorage.getItem('mobileFullscreenPrompted')) {
            requestFullscreenAndLandscape();
            localStorage.setItem('mobileFullscreenPrompted', 'true');
          }
        }
      };

      // Home screen button wiring.
      document.getElementById('play-btn')    .addEventListener('click', () => window.startScene('LevelSelectScene'));
      document.getElementById('saves-btn')   .addEventListener('click', () => window.startScene('SavesScene'));
      document.getElementById('settings-btn').addEventListener('click', () => window.startScene('SettingsScene'));
      if (profileBtn) {
        profileBtn.addEventListener('click', () => window.startScene('ProfileScene'));
      }

      // True when the browser's user-agent indicates a mobile device.
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // Requests fullscreen and locks orientation to landscape.
      // Handles all vendor-prefixed fullscreen APIs.
      function requestFullscreenAndLandscape() {
        const el = document.documentElement;
        const p  = el.requestFullscreen       ? el.requestFullscreen()
                 : el.mozRequestFullScreen    ? el.mozRequestFullScreen()
                 : el.webkitRequestFullscreen ? el.webkitRequestFullscreen()
                 : el.msRequestFullscreen     ? el.msRequestFullscreen()
                 : Promise.reject('Fullscreen not supported');
        p.catch(err => console.log('Fullscreen error:', err));

        if (screen.orientation?.lock) {
          screen.orientation.lock('landscape').catch(err => console.log('Orientation lock error:', err));
        }
      }

      // Exits fullscreen if the browser is currently in fullscreen mode.
      function exitFullscreen() {
        const d = document;
        if (d.fullscreenElement || d.mozFullScreenElement || d.webkitFullscreenElement || d.msFullscreenElement) {
          (d.exitFullscreen || d.mozCancelFullScreen || d.webkitExitFullscreen || d.msExitFullscreen).call(d);
        }
      }

      // Toggles fullscreen on the manual fullscreen button.
      fullscreenBtn.addEventListener('click', () => {
        const inFullscreen = document.fullscreenElement || document.mozFullScreenElement
          || document.webkitFullscreenElement || document.msFullscreenElement;
        inFullscreen ? exitFullscreen() : requestFullscreenAndLandscape();
      });

      // Resets the mobile fullscreen prompt flag when the user exits fullscreen,
      // so the next scene launch will re-request it.
      ['fullscreenchange','mozfullscreenchange','webkitfullscreenchange','msfullscreenchange'].forEach(evt => {
        document.addEventListener(evt, () => {
          const inFullscreen = document.fullscreenElement || document.mozFullScreenElement
            || document.webkitFullscreenElement || document.msFullscreenElement;
          if (!inFullscreen && isMobile && gameContainer.style.display === 'block') {
            localStorage.setItem('mobileFullscreenPrompted', 'false');
          }
        });
      });

      // Auto-request fullscreen on very first mobile page load (before any user gesture).
      if (isMobile) {
        document.addEventListener('DOMContentLoaded', () => {
          if (!localStorage.getItem('mobileFullscreenPrompted')) {
            requestFullscreenAndLandscape();
            localStorage.setItem('mobileFullscreenPrompted', 'true');
          }
        });
      }
    </script>
  </body>
</html>

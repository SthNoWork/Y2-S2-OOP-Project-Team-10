<!doctype html>
<!-- index.html
     Application shell and entry point.
     Owns: the home screen, startup loading bar, MusicManager, scene routing,
     fullscreen/orientation handling, and all DOM-to-script wiring.
     The Phaser canvas lives inside #game-container and is toggled visible/hidden
     as the player moves between the HTML home screen and Phaser scenes.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>Home Screen</title>
  <style>
    /* ── Reset ───────────────────────────────────────────────────────── */
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: Arial, sans-serif;
      /* Prevent mobile browser bouncing, gestures, and history navigation */
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 16:9 shell ──────────────────────────────────────────────────── */
    #screen-shell {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      overscroll-behavior: none;
      touch-action: none;
    }

    #screen-box {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      overflow: hidden;
      background: #000000;
      container-type: size;
    }

    /* ── Home screen ─────────────────────────────────────────────────── */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3%;
      background: url('asset/background/menu-theme.png') center / cover no-repeat;
      visibility: visible;
      opacity: 1;
      transition: opacity 0.15s ease-in-out;
    }
    
    #home-screen.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* Keep HEAD: absolute positioning for menu layout */
    .button-container {
      position: absolute;
      top: 45%;
      right: 14%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4cqh;
    }

    .home-btn {
      width: 18cqh;
      height: 5cqh;
      font-size: 2.2cqh;
      cursor: pointer;
      border: 2px solid #555;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.85);
      font-family: Arial, sans-serif;
    }

    @media (hover: hover) {
      .home-btn:hover {
        background: rgba(255, 255, 255, 1);
      }
    }

    /* ── Profile pill ────────────────────────────────────────────────── */
    .profile-panel {
      position: absolute;
      right: 2%;
      bottom: 2%;
      display: flex;
      align-items: center;
      gap: 1%;
      z-index: 2500;
    }

    .profile-panel .profile-btn {
      width: 5cqh;
      height: 5cqh;
      min-width: 0;
      min-height: 0;
      border-radius: 50%;
      border: 1px solid #000;
      padding: 0;
      cursor: pointer;
      background: center / cover no-repeat #1c2433;
      overflow: hidden;
    }

    .profile-panel .profile-name {
      font-size: 1.8cqh;
      color: #ffffff;
    }

    /* ── Game container ──────────────────────────────────────────────── */
    #game-container {
      position: absolute;
      inset: 0;
      visibility: hidden;
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.15s ease-in-out;
    }

    #game-container.active {
      visibility: visible;
      opacity: 1;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      touch-action: none;
    }

    /* ── Fullscreen button ───────────────────────────────────────────── */
    #fullscreen-btn {
      position: absolute;
      bottom: 3cqh;
      left: 3cqh;
      z-index: 999;
      padding: 1% 2%;
      font-size: 1.8cqh;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 1px solid white;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
    }

    @media (hover: hover) {
      #fullscreen-btn:hover {
        background: rgba(0, 0, 0, 0.85);
      }
      #html-back-btn:hover {
        background: rgba(255, 255, 255, 1);
        color: #000000;
      }
    }

    /* ── HTML Back Button ───────────────────────────────────────────── */
    #html-back-btn {
      position: absolute;
      top: 3cqh;
      left: 3cqh;
      z-index: 1900;
      padding: 1.2cqh 3cqh;
      font-size: 2cqh;
      cursor: pointer;
      border: 2px solid #ffffff;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-family: Arial, sans-serif;
      transition: background 0.15s ease-in-out, opacity 0.15s ease-in-out;
      visibility: hidden;
      opacity: 0;
    }

    #html-back-btn.active {
      visibility: visible;
      opacity: 1;
    }

    /* ── Loading overlay ─────────────────────────────────────────────── */
    #loading-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 10;
    }

    /* ── Startup splash ──────────────────────────────────────────────── */
    #startup-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('asset/background/theme.png') center / cover no-repeat;
      z-index: 2000;
    }

    #startup-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3%;
      transform: translateY(170%);
    }

    #startup-overlay .loading-text {
      font-size: 3cqh;
      color: white;
      background: transparent;
      border: 0;
      padding: 0;
    }

    #startup-progress {
      width: 40%;
      height: 2.5cqh;
      border: 2px solid #000;
      background: #fff;
      overflow: hidden;
      border-radius: 10px;
    }

    #startup-progress-bar {
      width: 0%;
      height: 100%;
      background: #2ecc71;
      border-radius: 10px;
    }

    /* ── Orientation Warning ─────────────────────────────────────────── */
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d1117;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    #orientation-warning .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: rotateDevice 2.5s ease-in-out infinite;
    }

    #orientation-warning h2 {
      font-size: 28px;
      margin: 10px 0;
      font-weight: 700;
      color: #58a6ff;
    }

    #orientation-warning p {
      font-size: 18px;
      color: #8b949e;
      max-width: 340px;
      line-height: 1.5;
    }

    @keyframes rotateDevice {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    /* Show only on touch devices in portrait mode */
    @media (pointer: coarse) and (orientation: portrait) {
      #orientation-warning {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <!-- 16:9 outer shell — everything lives inside here -->
  <div id="screen-shell">
    <div id="screen-box">

      <!-- Startup splash -->
      <div id="startup-overlay">
        <div id="startup-loading">
          <div id="startup-progress">
            <div id="startup-progress-bar"></div>
          </div>
          <div class="loading-text">Loading...</div>
        </div>
      </div>

      <!-- Home screen -->
      <div id="home-screen" class="hidden">
        <div class="button-container">
          <button class="home-btn" id="play-btn">Play</button>
          <button class="home-btn" id="play-1v1-btn">1v1 Local</button>
          <button class="home-btn" id="saves-btn">Shops</button>
          <button class="home-btn" id="leaderboard-btn">Leaderboard</button>
          <button class="home-btn" id="settings-btn">Settings</button>
        </div>
      </div>

      <!-- Profile pill -->
      <div class="profile-panel" id="profile-panel" style="display:none;">
        <button class="profile-btn" id="profile-btn" aria-label="Open profile">??</button>
        <div class="profile-name"><span id="profile-label">Signed out</span> <span id="profile-name">Guest</span></div>
      </div>

      <!-- Phaser canvas injected here -->
      <div id="game-container">
        <div id="loading-overlay"></div>
      </div>

      <!-- Fullscreen button -->
      <button id="fullscreen-btn">Fullscreen</button>

      <!-- HTML Back Button -->
      <button id="html-back-btn">Back</button>

    </div><!-- /screen-box -->
  </div><!-- /screen-shell -->

  <!--
      Script load order:
        1. Library
        2. Debug flag (needed by everything)
        3. Config data (no dependencies)
        4. Factories (depend on config)
        5. Core systems (depend on factories + config)
        6. Scenes (depend on core systems)
        7. Game config (must be LAST — references all scene classes)
    -->
  <script src="lib/phaser.min.js"></script>

  <script src="debug.js"></script>

  <script src="firebase/gameData.js"></script>
  <script type="module" src="firebase/init.js"></script>

  <script src="config/assets.config.js"></script>
  <script src="config/levels.config.js"></script>
  <script src="config/collisionLayers.config.js"></script>
  <script src="config/objects.config.js"></script>
  <script src="factories/spriteFactory.js"></script>
  <script src="factories/hudFactory.js"></script>
  <script src="factories/uiFactory.js"></script>
  <script src="core/entities/destructibleEntity.js"></script>
  <script src="core/entities/player.js"></script>
  <script src="core/entities/building.js"></script>
  <script src="core/entities/attacker.js"></script>
  <script src="core/entities/pillbox.js"></script>
  <script src="core/entities/mortar.js"></script>
  <script src="core/entities/plane.js"></script>
  <script src="core/entityManager.js"></script>
  <script src="core/barrageController.js"></script>
  <script src="factories/objectFactory.helpers.js"></script>
  <script src="factories/objectFactory.js"></script>

  <script src="core/powerUpManager.js"></script>
  <script src="core/gameLogic.helper.js"></script>
  <script src="core/explosionCommand.js"></script>
  <script src="core/gameLogic.js"></script>
  <script src="core/sfxManager.js"></script>
  <script src="core/buildingManager.js"></script>
  <script src="core/levelManager.js"></script>

  <script src="scenes/baseScene.js"></script>
  <script src="scenes/bootScene.js"></script>
  <script src="scenes/gameScene.js"></script>
  <script src="core/game1v1States.js"></script>
  <script src="scenes/game1v1Scene.js"></script>
  <script src="scenes/levelSelectScene.js"></script>
  <script src="scenes/settingsScene.js"></script>
  <script src="scenes/shopsScene.js"></script>
  <script src="scenes/profileScene.js"></script>
  <script src="scenes/leaderboardScene.js"></script>
  <script src="config/game.config.js"></script>

  <script>
    window.SceneClasses = {
      BootScene,
      GameScene,
      Game1v1Scene,
      LevelSelectScene,
      SettingsScene,
      ShopScene,
      LeaderboardScene,
      ProfileScene,
    };

    const homeScreen = document.getElementById('home-screen');
    const profilePanel = document.getElementById('profile-panel');
    const gameContainer = document.getElementById('game-container');
    const loadingOverlay = document.getElementById('loading-overlay');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const htmlBackBtn = document.getElementById('html-back-btn');
    const startupOverlay = document.getElementById('startup-overlay');
    const startupBar = document.getElementById('startup-progress-bar');
    const profileBtn = document.getElementById('profile-btn');
    const profileLabel = document.getElementById('profile-label');
    const profileName = document.getElementById('profile-name');
    const leaderboardBtn = document.getElementById('leaderboard-btn');
    let profilePanelHiddenByScene = false;

    function getProfileName(user) {
      return user?.displayName || user?.email?.split('@')[0] || 'Player';
    }

    function updateProfilePanel(user = window.FirebaseAuth?.currentUser) {
      if (!profilePanel || !profileBtn || !profileName) return;

      if (profilePanelHiddenByScene) {
        profilePanel.style.display = 'none';
        return;
      }

      const hasUser = !!user;
      if (!hasUser) {
        profilePanel.style.display = 'flex';
        profileBtn.style.backgroundImage = 'none';
        profileBtn.textContent = '?';
        profileLabel.textContent = 'Signed out';
        profileName.textContent = 'Guest';
        profileBtn.setAttribute('aria-label', 'Sign in to your profile');
        return;
      }

      const name = getProfileName(user);
      profilePanel.style.display = 'flex';
      profileLabel.textContent = 'Logged in as';
      profileName.textContent = name;
      profileBtn.setAttribute('aria-label', `${name} profile`);

      if (user.photoURL) {
        profileBtn.style.backgroundImage = `url("${user.photoURL}")`;
        profileBtn.textContent = '';
      } else {
        profileBtn.style.backgroundImage = 'linear-gradient(135deg, #3b4f6b, #1b2433)';
        profileBtn.textContent = name.slice(0, 2).toUpperCase();
      }
    }

    // ── MusicManager ────────────────────────────────────────────────────
    // Per-level music path from levels config (restructured); volume
    // persistence and getVolume/setVolume kept from HEAD.
    window.MusicManager = window.MusicManager || (() => {
      const volumeKey = 'bts_volume';
      let volume = 0.5;
      try {
        const stored = parseFloat(localStorage.getItem(volumeKey));
        if (Number.isFinite(stored)) volume = Math.min(1, Math.max(0, stored));
      } catch (err) {
        // Ignore storage errors (private mode, disabled storage).
      }

      const sharedPath = 'asset/music/Forest Drift.mp3';
      const levelDefaultPath = 'asset/music/Shield the Sky.mp3';
      const sharedAudio = new Audio(sharedPath);
      sharedAudio.loop = true;
      sharedAudio.volume = volume;

      return {
        mode: 'shared', sharedAudio, levelAudio: null, currentLevelPath: null,

        getVolume() {
          return volume;
        },

        setVolume(next) {
          const raw = Number(next);
          if (!Number.isFinite(raw)) return volume;
          volume = Math.min(1, Math.max(0, raw));
          this.sharedAudio.volume = volume;
          if (this.levelAudio) this.levelAudio.volume = volume;
          try {
            localStorage.setItem(volumeKey, String(volume));
          } catch (err) {
            // Ignore storage errors (private mode, disabled storage).
          }
          return volume;
        },

        playShared(opts = {}) {
          const restart = !!opts.restart;
          if (this.mode === 'shared' && !restart && !this.sharedAudio.paused) return;
          if (this.levelAudio) { this.levelAudio.pause(); this.levelAudio.currentTime = 0; }
          if (restart) this.sharedAudio.currentTime = 0;
          this.sharedAudio.play().catch(() => { });
          this.mode = 'shared';
        },

        playLevel(levelNum) {
          // Default to the level theme if no per-level track is defined.
          const path = window.Levels?.[levelNum]?.music || levelDefaultPath;
          this.sharedAudio.pause();
          this.sharedAudio.currentTime = 0;
          if (!this.levelAudio || this.currentLevelPath !== path) {
            if (this.levelAudio) { this.levelAudio.pause(); this.levelAudio.currentTime = 0; }
            this.levelAudio = new Audio(path);
            this.levelAudio.loop = true;
            this.levelAudio.volume = volume;
            this.currentLevelPath = path;
          } else {
            this.levelAudio.currentTime = 0;
          }
          this.levelAudio.play().catch(() => { });
          this.mode = 'level';
        },
      };
    })();

    // Start audio on first user gesture (satisfies browser autoplay policy).
    const startAudioOnGesture = () => {
      if (window.currentActiveScene === 'HomeScreen') {
        window.MusicManager.playShared({ restart: false });
      }
    };
    document.addEventListener('pointerdown', startAudioOnGesture, { once: true });
    document.addEventListener('keydown', startAudioOnGesture, { once: true });

    // Scenes listed here hide the profile panel while active.
    const HIDE_PROFILE_IN = new Set(['GameScene']);
    window.currentActiveScene = 'HomeScreen';

    let game = null;

    function destroyGame() {
      if (game) { game.destroy(true); game = null; }
    }

    const fullscreenSupported = !!(
      document.documentElement.requestFullscreen ||
      document.documentElement.mozRequestFullScreen ||
      document.documentElement.webkitRequestFullscreen ||
      document.documentElement.msRequestFullscreen
    );

    // Initial fullscreen button display check
    if (fullscreenSupported) {
      fullscreenBtn.style.display = 'block';
    } else {
      fullscreenBtn.style.display = 'none';
    }

    // ── showHomeScreen ───────────────────────────────────────────────────
    window.showHomeScreen = function () {
      setTimeout(() => {
        if (game) {
          game.scene.scenes.forEach(s => {
            if (s.scene.isActive()) {
              if (typeof s.clear === 'function') {
                try { s.clear(); } catch (e) { console.error(e); }
              }
              s.scene.stop();
            }
          });
          game.loop.pause();
        }
        gameContainer.classList.remove('active');
        homeScreen.classList.remove('hidden');
        if (htmlBackBtn) htmlBackBtn.classList.remove('active');
        try { window.SfxManager?.unmuteAll?.(); } catch (e) { }
        profilePanelHiddenByScene = false;
        updateProfilePanel();
        window.MusicManager.playShared({ restart: window.MusicManager.mode === 'level' });
        window.currentActiveScene = 'HomeScreen';
      }, 0);
    };

    // ── Startup preloader ─────────────────────────────────────────────────
    window.finishStartup = function () {
      if (startupOverlay) startupOverlay.style.display = 'none';
      window.showHomeScreen();
    };

    window.addEventListener('load', () => {
      // Initialize the game immediately to begin asset preloading in the background
      game = new Phaser.Game(config);
    }, { once: true });

    // ── startScene ───────────────────────────────────────────────────────
    window.startScene = function (sceneKey) {
      setTimeout(() => {
        try { window.SfxManager?.unmuteAll?.(); } catch (e) { }

        homeScreen.classList.add('hidden');
        gameContainer.classList.add('active');
        if (htmlBackBtn) htmlBackBtn.classList.add('active');
        profilePanelHiddenByScene = HIDE_PROFILE_IN.has(sceneKey);

        window.currentActiveScene = sceneKey;

        if (sceneKey === 'GameScene' || sceneKey === 'Game1v1Scene') {
          window.MusicManager.playLevel(sceneKey === 'Game1v1Scene' ? '1v1' : (window._currentLevel ?? 1));
        } else {
          window.MusicManager.playShared({ restart: window.MusicManager.mode === 'level' });
        }

        updateProfilePanel();

        if (game) {
          game.loop.resume();
          // Stop and clear other active scenes first
          game.scene.scenes.forEach(s => {
            if (s.scene.isActive() && s.sys.settings.key !== sceneKey) {
              if (typeof s.clear === 'function') {
                try { s.clear(); } catch (e) { console.error(e); }
              }
              s.scene.stop();
            }
          });
          // Recreate the target scene by removing it and re-adding it
          const sceneClass = window.SceneClasses[sceneKey];
          if (sceneClass) {
            try {
              const existingScene = game.scene.getScene(sceneKey);
              if (existingScene) {
                if (typeof existingScene.clear === 'function') {
                  try { existingScene.clear(); } catch (e) { console.error(e); }
                }
              }
              game.scene.remove(sceneKey);
              game.scene.add(sceneKey, sceneClass, true);
            } catch (e) {
              console.error(e);
            }
          } else {
            game.scene.start(sceneKey);
          }
          loadingOverlay.style.display = 'none';
        }

        if (isMobile && fullscreenSupported) {
          if (!localStorage.getItem('mobileFullscreenPrompted')) {
            requestFullscreenAndLandscape();
            localStorage.setItem('mobileFullscreenPrompted', 'true');
          }
        }
      }, 0);
    };

    // ── Button wiring ────────────────────────────────────────────────────
    document.getElementById('play-btn').addEventListener('click', () => window.startScene('LevelSelectScene'));
    document.getElementById('play-1v1-btn').addEventListener('click', () => window.startScene('Game1v1Scene'));
    document.getElementById('saves-btn').addEventListener('click', () => window.startScene('ShopScene'));
    document.getElementById('leaderboard-btn').addEventListener('click', () => window.startScene('LeaderboardScene'));
    document.getElementById('settings-btn').addEventListener('click', () => window.startScene('SettingsScene'));
    if (profileBtn) profileBtn.addEventListener('click', () => window.startScene('ProfileScene'));

    if (htmlBackBtn) {
      htmlBackBtn.addEventListener('click', () => {
        triggerBackGesture();
      });
    }



    window.addEventListener('authStateChanged', () => updateProfilePanel());

    // ── Mobile / fullscreen helpers ──────────────────────────────────────
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    function requestFullscreenAndLandscape() {
      const el = document.documentElement;
      const p = el.requestFullscreen ? el.requestFullscreen()
        : el.mozRequestFullScreen ? el.mozRequestFullScreen()
          : el.webkitRequestFullscreen ? el.webkitRequestFullscreen()
            : el.msRequestFullscreen ? el.msRequestFullscreen()
              : Promise.reject('not supported');
      p.catch(e => console.log('Fullscreen error:', e));
      screen.orientation?.lock?.('landscape').catch(e => console.log('Orientation error:', e));
    }

    function exitFullscreen() {
      const d = document;
      if (d.fullscreenElement || d.mozFullScreenElement || d.webkitFullscreenElement || d.msFullscreenElement) {
        (d.exitFullscreen || d.mozCancelFullScreen || d.webkitExitFullscreen || d.msExitFullscreen).call(d);
      }
    }

    fullscreenBtn.addEventListener('click', () => {
      const inFS = document.fullscreenElement || document.mozFullScreenElement
        || document.webkitFullscreenElement || document.msFullscreenElement;
      inFS ? exitFullscreen() : requestFullscreenAndLandscape();
    });

    ['fullscreenchange', 'mozfullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(evt => {
      document.addEventListener(evt, () => {
        const inFS = document.fullscreenElement || document.mozFullScreenElement
          || document.webkitFullscreenElement || document.msFullscreenElement;
        
        // Dynamically update fullscreen button labels
        const label = inFS ? 'Exit Fullscreen' : 'Fullscreen';
        if (fullscreenBtn) fullscreenBtn.textContent = label;

        if (!inFS && isMobile && gameContainer.classList.contains('active')) {
          localStorage.setItem('mobileFullscreenPrompted', 'false');
        }
      });
    });

    if (isMobile && fullscreenSupported) {
      document.addEventListener('DOMContentLoaded', () => {
        if (!localStorage.getItem('mobileFullscreenPrompted')) {
          requestFullscreenAndLandscape();
          localStorage.setItem('mobileFullscreenPrompted', 'true');
        }
      });
    }

    // Prevent double-tap zooming, edge swipe navigation, and bounce scrolling on touch devices
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    // Swipe-to-back gesture detection for mobile devices (using capture phase to bypass Phaser's propagation block)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, true);

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const touchEndTime = Date.now();

        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        const duration = touchEndTime - touchStartTime;

        // Swipe criteria:
        // 1. Swiped from left to right (diffX > 80px)
        // 2. Mostly horizontal (absolute diffY < 60px)
        // 3. Fast enough (duration < 350ms)
        // 4. Started near the left edge (touchStartX < window.innerWidth * 0.35)
        if (diffX > 80 && Math.abs(diffY) < 60 && duration < 350 && touchStartX < window.innerWidth * 0.35) {
          triggerBackGesture();
        }
      }
    }, true);

    function triggerBackGesture() {
      if (!window.currentActiveScene) return;

      if (window.currentActiveScene === 'GameScene') {
        window.startScene('LevelSelectScene');
      } else if (window.currentActiveScene === 'Game1v1Scene') {
        window.showHomeScreen();
      } else if (
        window.currentActiveScene === 'LevelSelectScene' ||
        window.currentActiveScene === 'ShopScene' ||
        window.currentActiveScene === 'LeaderboardScene' ||
        window.currentActiveScene === 'SettingsScene' ||
        window.currentActiveScene === 'ProfileScene'
      ) {
        window.showHomeScreen();
      }
    }
  </script>

  <!-- Orientation warning overlay (visible only on mobile in portrait) -->
  <div id="orientation-warning">
    <div class="icon">📱</div>
    <h2>Rotate Your Device</h2>
    <p>Please rotate your device to landscape mode to play the game.</p>
  </div>
</body>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Screen</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #808080;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .title {
        margin: 0;
        text-align: center;
      }

      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      button {
        min-width: 120px;
      }

      .profile-panel {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 999;
      }

      .profile-panel button {
        width: 48px;
        height: 48px;
        min-width: 48px;
        border-radius: 50%;
        border: 1px solid #000;
        padding: 0;
      }

      .profile-panel .profile-name {
        font-size: 14px;
      }

      .profile-panel .profile-name span {
        font-weight: 700;
      }

      #game-container {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #808080;
      }

      #game-container canvas {
        display: block;
        background: #808080;
      }
    </style>
  </head>
  <body>
    <main id="home-screen">
      <h1 class="title">Title</h1>
      <div class="button-container">
        <button id="play-btn">play</button>
        <button id="saves-btn">saves</button>
        <button id="settings-btn">settings</button>
      </div>
    </main>

    <div class="profile-panel" id="profile-panel">
      <button id="profile-btn" aria-label="Profile"></button>
      <div class="profile-name">Logged in as <span>Name</span></div>
    </div>

    <div id="game-container"></div>

    <script src="phaser.js"></script>
    <script src="Scenes/bootScene.js"></script>
    <script src="Scenes/gameScene.js"></script>
    <script src="Scenes/levelSelectScene.js"></script>
    <script src="Scenes/settingsScene.js"></script>
    <script src="Scenes/savesScene.js"></script>
    <script src="Scenes/profileScene.js"></script>
    <script src="Game.js"></script>
    <script>
      let game = null;

      const homeScreen    = document.getElementById("home-screen");
      const gameContainer = document.getElementById("game-container");
      const profilePanel  = document.getElementById("profile-panel");

      const HIDE_PROFILE_IN = ["GameScene"];

      window.showHomeScreen = function () {
        gameContainer.style.display = "none";
        homeScreen.style.display = "flex";
        profilePanel.style.display = "flex";
      };

      window.startScene = function (sceneKey) {
        homeScreen.style.display = "none";
        gameContainer.style.display = "block";
        profilePanel.style.display = HIDE_PROFILE_IN.includes(sceneKey) ? "none" : "flex";

        if (!game) {
          game = new Phaser.Game(config);
          game.events.once("ready", () => game.scene.start(sceneKey));
          return;
        }

        // stop every active scene then start the one we want fresh
        game.scene.getScenes(true).forEach(s => game.scene.stop(s.sys.settings.key));
        game.scene.start(sceneKey);
      };

      document.getElementById("play-btn").addEventListener("click",     () => window.startScene("LevelSelectScene"));
      document.getElementById("saves-btn").addEventListener("click",    () => window.startScene("SavesScene"));
      document.getElementById("settings-btn").addEventListener("click", () => window.startScene("SettingsScene"));
      document.getElementById("profile-btn").addEventListener("click",  () => window.startScene("ProfileScene"));
    </script>
  </body>
</html>
